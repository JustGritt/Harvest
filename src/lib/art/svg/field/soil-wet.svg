	<ellipse cx="7.5" cy="14.5" rx="1" ry="0.6" fill="#ad7f4f"/>
	<ellipse cx="23" cy="16.5" rx="1.4" ry="1" fill="#734d2b"/>
	<circle cx="17" cy="13.5" r="0.8" fill="#5a3b22"/>
