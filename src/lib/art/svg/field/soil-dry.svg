<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<rect width="32" height="32" fill="#c9a274"/>
	<!-- two furrows per tile: lit ridge, groove, shaded lip -->
	<rect y="5" width="32" height="1.5" fill="#e1c7a4"/>
	<rect y="6.5" width="32" height="3" fill="#ad7f4f"/>
	<rect y="9.5" width="32" height="1" fill="#8e6238"/>
	<rect y="21" width="32" height="1.5" fill="#e1c7a4"/>
	<rect y="22.5" width="32" height="3" fill="#ad7f4f"/>
	<rect y="25.5" width="32" height="1" fill="#8e6238"/>
	<!-- clods and pebbles, kept off the edges so the tile repeats cleanly -->
	<ellipse cx="8" cy="15" rx="2" ry="1.3" fill="#ad7f4f"/>
	<ellipse cx="7.5" cy="14.5" rx="1" ry="0.6" fill="#e1c7a4"/>
	<ellipse cx="23" cy="16.5" rx="1.4" ry="1" fill="#ad7f4f"/>
	<circle cx="17" cy="13.5" r="0.8" fill="#8e6238"/>
	<circle cx="27" cy="30" r="0.9" fill="#ad7f4f"/>
	<circle cx="12" cy="29.5" r="0.7" fill="#8e6238"/>
	<circle cx="4" cy="2.5" r="0.7" fill="#ad7f4f"/>
</svg>
